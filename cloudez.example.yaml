# Configuração de deploy Cloudez.
# Copie para `.cloudez.yaml` na raiz do projeto publicado e ajuste.
# Lembre de adicionar `.cloudez/` ao .gitignore — é onde fica o estado dos
# deploys.
#
# Cada chave dentro de `cloudez:` é um environment. O nome é livre: um projeto
# com um destino só costuma usar `default`.

cloudez:
  staging:
    # O domínio identifica o site.
    domain: staging.meusite.com.br

    # Onde o deploy publica, sempre explícito. O document root do site na
    # Cloudez é `~/<domain>/www`, e as releases ficam no subdiretório `claude/`
    # dele — assim o deploy não toma conta do `www` inteiro. O document root no
    # painel precisa apontar para `<root>/current`, o symlink que o deploy troca
    # atomicamente.
    root: ~/staging.meusite.com.br/www/claude

    # Não há bloco `ssh` aqui: host e usuário vêm da conta, pelo
    # cloudez_get_site, a cada deploy. Uma cópia num arquivo versionado
    # envelheceria se a Cloudez movesse o site de servidor.

  production:
    domain: meusite.com.br
    root: ~/meusite.com.br/www/claude

