name: test

on:
  push:
  pull_request:

jobs:
  test:
    # A matriz nao e cerimonia. Os scripts em shell que restam rodam na maquina
    # do desenvolvedor, que costuma ser macOS, e o servidor e Linux. As duas
    # plataformas divergem em utilitarios que este projeto usa: `mv -T` (so no
    # GNU coreutils) e o bash 3.2 que o macOS ainda traz, sem `mapfile`. Os dois
    # ja quebraram aqui por so termos testado num lugar.
    #
    # Windows nao esta na matriz porque portar a suite bats para la exigiria bash e
    # coreutils no runner. A cobertura daquela plataforma mora no job `windows`, que
    # exercita as duas portas de entrada do sync.
    #
    # A unica dependencia que sobra para instalar aqui e o shellcheck, e ele e de
    # lint: a suite em si roda com o runtime que o plugin ja exige. O jq saiu quando
    # test/helpers/json.mjs assumiu a extracao de campo.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependências (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Instalar dependências (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Rodar a suíte
        run: ./test/run.sh --strict

  # Portar a suite bats para Windows significaria bash e coreutils no runner — muito
  # trabalho para cobrir o que ja e verificado em duas outras plataformas. O
  # que interessa aqui sao as duas PORTAS DE ENTRADA do sync naquela plataforma,
  # que nenhuma outra exercita.
  #
  # Este job substitui tres que existiam antes — `windows` (dois launchers),
  # `windows-build` (compilar e executar o binario no proprio Windows) e o
  # `binarios` (reconstruir os seis blobs de libexec/ e comparar byte a byte). Os
  # dois ultimos existiam porque o plugin embarcava artefato compilado que quem
  # instala nao consegue auditar lendo o repositorio. Com o sync em Node o fonte E
  # o que embarca, e nao ha mais o que reconstruir para conferir.
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Node 20 explicito, e nao o que o runner traz por acaso.
      #
      # 20 e o piso que o plugin declara, e a diferenca importa exatamente aqui: um
      # arquivo SEM EXTENSAO com sintaxe ESM e lido como CommonJS pelo Node 20 — o
      # que o `bin/package.json` resolve — enquanto o Node 22+ detecta o modulo
      # sozinho. Um runner moderno esconderia justamente o defeito que quebraria no
      # piso, e ja escondeu uma vez.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # A porta de quem chama pelo cmd ou pelo PowerShell: o `.cmd`, que existe
      # porque no Windows o shebang nao vale nada.
      - name: Launcher .cmd
        shell: pwsh
        run: ./test/windows/launcher.ps1

      # A outra porta. No Windows o plugin tambem e chamado de dentro de um bash —
      # Git Bash vem junto com o Git, e e o shell que varias ferramentas usam para
      # rodar comando. Ai quem responde e o `bin/cloudez-sync` pelo shebang.
      #
      # Ja quebrou exatamente aqui, na versao anterior desta peca: `uname -s` no
      # Git Bash devolve `MINGW64_NT-10.0-22631`, nao `windows`, e o launcher
      # montava um nome de binario que nunca existiu. O .cmd tinha cobertura desde
      # sempre e o POSIX nao, entao o defeito ficou invisivel: ha duas portas, e uma
      # so era verificada.
      #
      # Este script tambem carrega a ANCORA DO HASH entre plataformas, que era o que
      # o extinto `windows-build` verificava de mais valioso: o mesmo conteudo tem
      # de dar o mesmo content_sha256 aqui e nas outras duas plataformas, senao dois
      # deploys do mesmo conteudo viram releases diferentes.
      #
      # `shell: bash` no runner Windows e exatamente esse Git Bash — o mesmo
      # ambiente do usuario, nao uma aproximacao.
      - name: Sync sob Git Bash
        shell: bash
        run: ./test/windows/sync-git-bash.sh
